<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Opener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SECTION (Ro'yxatdan o'tish / Kirish) -->
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h1>CASE OPENER</h1>
      <p>O'yinga kirish uchun login va parol kiriting</p>
      
      <input type="text" id="username-input" placeholder="Login...">
      <input type="password" id="password-input" placeholder="Parol...">
      
      <div class="auth-buttons">
        <button onclick="login()">Kirish</button>
        <button onclick="register()" class="secondary-btn">Hisob ochish</button>
      </div>
      <p id="auth-msg" class="msg"></p>
    </div>
  </div>

  <!-- MAIN GAME SECTION (O'yin qismi) -->
  <div id="game-screen" class="screen hidden">
    <header>
      <div class="user-info">
        <span id="user-display">Foydalanuvchi</span>
        <div class="balance-box">
          💰 Balans: <span id="balance-display">100</span> coin
        </div>
      </div>
      <button onclick="logout()" class="logout-btn">Chiqish</button>
    </header>

    <main class="container">
      <h2>CASE'LAR DO'KONI</h2>
      
      <div class="cases-grid">
        <!-- Temir Case -->
        <div class="case-card iron">
          <h3>Temir Case</h3>
          <p class="price">15 Coin</p>
          <button onclick="openCase('iron', 15)">Ochish</button>
        </div>

        <!-- Oltin Case -->
        <div class="case-card gold">
          <h3>Oltin Case</h3>
          <p class="price">30 Coin</p>
          <button onclick="openCase('gold', 30)">Ochish</button>
        </div>

        <!-- Diamond Case -->
        <div class="case-card diamond">
          <h3>Diamond Case</h3>
          <p class="price">70 Coin</p>
          <button onclick="openCase('diamond', 70)">Ochish</button>
        </div>
      </div>

      <!-- Ruletka paneli -->
      <div id="roulette-section" class="case-box hidden">
        <h3 id="current-case-title">Case</h3>
        <div class="roulette-wrapper">
          <div class="pointer"></div>
          <div class="roulette" id="roulette"></div>
        </div>
      </div>
    </main>

    <!-- Yutuq oynasi -->
    <div id="result-modal" class="modal">
      <div class="modal-content">
        <h2>TABRIKLAYMIZ!</h2>
        <p id="win-item-name">Siz yutdingiz</p>
        <button onclick="closeModal()">Davom etish</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
